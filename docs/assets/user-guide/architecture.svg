<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="710" viewBox="0 0 1120 710" role="img" aria-labelledby="title desc"><title id="title">SysAgent 双端、证据链和第三方查询结构</title><desc id="desc">桌面与 IDE 共用 UI 和控制器代码，各实例有自己的缓存。sysAK 通过特权 socket 采集，AgentSight 独立提供五类证据；外部程序只能查询缓存，不能通过公共 HTTP 执行。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#4b6c87"/></marker><style>text{font-family:Arial,'Noto Sans CJK SC',sans-serif;fill:#203b52;font-size:17px}.head{font-size:25px;font-weight:bold}.bold{font-weight:bold}.small{font-size:14px}.box{rx:14;stroke:#a9c4d9;stroke-width:1.5;fill:#f5faff}.line{fill:none;stroke:#4b6c87;stroke-width:2;marker-end:url(#arrow)}</style></defs><rect width="1120" height="710" fill="#fff"/><text x="40" y="45" class="head">SysAgent 管家：展示、采集、分析与查询分离</text><rect x="35" y="75" width="665" height="490" rx="18" fill="#edf5fb"/><text x="55" y="104" class="bold">普通用户权限 · 每个宿主实例独立运行</text><rect x="60" y="125" width="260" height="65" class="box"/><text x="82" y="152" class="bold">Electron 桌面</text><text x="82" y="176" class="small">主窗口 / 小管家 · preload IPC</text><rect x="360" y="125" width="310" height="65" class="box"/><text x="382" y="152" class="bold">VS Code 兼容 IDE 插件</text><text x="382" y="176" class="small">Webview / 状态栏 · 限定 RPC</text><path d="M190,190 L190,220 M510,190 L510,220" class="line"/><rect x="60" y="220" width="610" height="65" class="box"/><text x="82" y="247" class="bold">共享 React 界面与数据模型</text><text x="82" y="272" class="small">体检 / 资源 / GPU / Agent · Demo 页面单独标注</text><path d="M365,285 L365,315" class="line"/><rect x="60" y="315" width="610" height="80" class="box"/><text x="82" y="345" class="bold">IDC 控制器：采集调度 + 实例缓存 + 受控操作</text><text x="82" y="372" class="small">Health revision、Agent 采样时间、任务元数据；缓存并非持久化数据库</text><path d="M365,395 L365,425" class="line"/><rect x="60" y="425" width="610" height="100" class="box"/><text x="82" y="454" class="bold">内部 OpenAPI / 解析与诊断</text><text x="82" y="480">sysAK 证据 → 资源 / 体检 / GPU 结果</text><text x="82" y="505">AgentSight 五类元数据 → 独立 Agent 报告</text><rect x="760" y="95" width="320" height="115" class="box"/><text x="782" y="125" class="bold">第三方本机程序</text><text x="782" y="153">Python / curl / 其他应用</text><text x="782" y="180" class="small">读取 0600 发现文件中的端口和凭据</text><path d="M920,210 L920,245" class="line"/><rect x="760" y="245" width="320" height="150" class="box"/><text x="782" y="275" class="bold">只读本机 HTTP API</text><text x="782" y="303">127.0.0.1 随机端口</text><text x="782" y="330">独立 Bearer + Host / Origin 校验</text><text x="782" y="357">只允许 GET · 15 个数据集</text><text x="782" y="383" class="small">不采集 / 不清理 / 不代理内部写接口</text><path d="M760,355 L680,355" class="line"/><text x="708" y="343" class="small">读缓存</text><rect x="760" y="435" width="320" height="115" class="box"/><text x="782" y="465" class="bold">独立 AgentSight 0.16.0</text><text x="782" y="493">API 与 trace 服务分离</text><text x="782" y="520" class="small">主机采集须显式授权；界面只读元数据</text><path d="M760,490 L680,490" class="line"/><rect x="35" y="590" width="1045" height="90" rx="14" fill="#fff7e8" stroke="#d4ac5e"/><text x="58" y="620" class="bold">管理员安装的固定 sysAK IDC 服务</text><text x="58" y="649">root 服务 · /run/sysom-idc/idc.sock · 用户授权 / 身份校验 / 固定允许操作</text><path d="M330,525 L330,588" class="line"/><text x="350" y="558" class="small">受控 socket：采集及单独确认的进程操作</text></svg>