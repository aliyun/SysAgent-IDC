<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="480" viewBox="0 0 1120 480" role="img" aria-labelledby="title"><title id="title">SysAgent 新用户操作与结果判断流程</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#54728a"/></marker><style>text{font-family:Arial,'Noto Sans CJK SC',sans-serif;fill:#203b52;font-size:17px}.title{font-size:25px;font-weight:bold}.b{font-weight:bold}.s{font-size:14px}rect{rx:14}.line{stroke:#54728a;stroke-width:2;fill:none;marker-end:url(#a)}</style></defs><rect width="1120" height="480" fill="white"/><text x="35" y="45" class="title">先看来源与覆盖，再判断异常，最后选择操作</text><g fill="#edf6ff" stroke="#9fbed4"><rect x="35" y="95" width="220" height="110"/><rect x="310" y="95" width="220" height="110"/><rect x="585" y="95" width="220" height="110"/><rect x="860" y="95" width="220" height="110"/></g><text x="55" y="125" class="b">1. 打开桌面或 IDE</text><text x="55" y="155">确认本机 / 当前用户</text><text x="55" y="182" class="s">首次需要管理员安装和授权</text><text x="330" y="125" class="b">2. 看采集与 API 状态</text><text x="330" y="155">资源和 Agent 独立</text><text x="330" y="182" class="s">API 可用 ≠ 已采到真实调用</text><text x="605" y="125" class="b">3. 刷新相应数据</text><text x="605" y="155">资源 / 体检 / GPU / Agent</text><text x="605" y="182" class="s">看采样时间、窗口、覆盖原因</text><text x="880" y="125" class="b">4. 查看详情和报告</text><text x="880" y="155">查单位、证据、建议</text><text x="880" y="182" class="s">0 是实测零；— 是缺失</text><path d="M255,150 L308,150 M530,150 L583,150 M805,150 L858,150" class="line"/><path d="M970,205 L970,245 L300,245 L300,280" class="line"/><path d="M970,245 L810,245 L810,280" class="line"/><rect x="80" y="285" width="455" height="140" fill="#f1faf4" stroke="#9fc8ac"/><text x="103" y="318" class="b">有完整证据</text><text x="103" y="347">结合阈值 / 业务背景判断是否异常</text><text x="103" y="375">可导出报告，或由第三方读取缓存</text><text x="103" y="402" class="s">结束进程：先核对身份，再二次确认；可能丢失任务</text><rect x="585" y="285" width="455" height="140" fill="#fff7e8" stroke="#d4ac5e"/><text x="608" y="318" class="b">未检查 / 部分 / 不可用 / 空列表</text><text x="608" y="347">先查看覆盖原因，不下“正常”结论</text><text x="608" y="375">核对服务、授权、硬件和支持的调用链</text><text x="608" y="402" class="s">刷新失败保留旧报告；旧数据不代表本次状态</text></svg>