<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="500" viewBox="0 0 1120 500" role="img" aria-labelledby="title"><title id="title">第三方程序接入 SysAgent 本机查询接口的步骤</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#4b6c87"/></marker><style>text{font-family:Arial,'Noto Sans CJK SC',sans-serif;fill:#203b52;font-size:17px}.title{font-size:25px;font-weight:bold}.b{font-weight:bold}.s{font-size:14px}.line{stroke:#4b6c87;stroke-width:2;fill:none;marker-end:url(#a)}rect{rx:14}</style></defs><rect width="1120" height="500" fill="white"/><text x="35" y="45" class="title">第三方接入：发现实例 → 认证 → 能力发现 → 一致性查询</text><g fill="#eef6ff" stroke="#a4c0d5"><rect x="35" y="90" width="240" height="135"/><rect x="310" y="90" width="240" height="135"/><rect x="585" y="90" width="240" height="135"/><rect x="860" y="90" width="225" height="135"/></g><text x="55" y="122" class="b">1. 选择运行中的宿主</text><text x="55" y="153">local-api / 实例 UUID.json</text><text x="55" y="181" class="s">0700 目录 · 0600 文件</text><text x="55" y="207" class="s">不打印 / 上传 / 提交 token</text><text x="330" y="122" class="b">2. GET /status</text><text x="330" y="153">Authorization: Bearer …</text><text x="330" y="181" class="s">使用文件中的 127.0.0.1 地址</text><text x="330" y="207" class="s">核对 instance_id 与设备身份</text><text x="605" y="122" class="b">3. GET /capabilities</text><text x="605" y="153">缓存状态 / 字段 / 限制</text><text x="605" y="181" class="s">GET /openapi.json 取契约</text><text x="605" y="207" class="s">不可用不填零，不自动采集</text><text x="880" y="122" class="b">4. 读取快照或列表</text><text x="880" y="153">filter / sort / fields</text><text x="880" y="181" class="s">offset / limit / revision</text><text x="880" y="207" class="s">详情 ID 整体 URI 编码一次</text><path d="M275,158 L308,158 M550,158 L583,158 M825,158 L858,158" class="line"/><path d="M970,225 L970,280 L680,280 L680,310" class="line"/><rect x="360" y="315" width="675" height="135" fill="#f3faf5" stroke="#a4c9b0"/><text x="385" y="347" class="b">5. 解释数据与处理变化</text><text x="385" y="378">revision 是 Health 版本；Agent 按独立采样时间 / 窗口核对</text><text x="385" y="406">分页仅覆盖缓存，不扩大上游采集量；total 不代表全机总量</text><text x="385" y="435" class="s">409：重新取一致版本 · 503：在界面获取证据后重试 · 重启：重新发现实例</text><rect x="35" y="315" width="280" height="135" fill="#fff7e8" stroke="#d4ac5e"/><text x="55" y="347" class="b">明确不开放</text><text x="55" y="378">POST / 清理 / 刷新 / 配置修改</text><text x="55" y="406">内部写 token / 任意命令</text><text x="55" y="435" class="s">浏览器 Origin 被拒绝，无 CORS</text></svg>